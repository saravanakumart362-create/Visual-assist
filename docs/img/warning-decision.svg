<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="The chain of questions before an obstacle warning: nothing is said if the reading is outside the warning distance or is the guidance target; an obstacle under 1.5 seconds away gets Stop; otherwise a warning is spoken unless the assistant is busy or has just warned of the same thing.">
<title>The chain of questions before an obstacle warning: nothing is said if the reading is outside the warning distance or is the guidance target; an obstacle under 1.5 seconds away gets Stop; otherwise a warning is spoken unless the assistant is busy or has just warned of the same thing.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#13202c"/></marker><marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0c7c74"/></marker><marker id="arrow-lidar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cf2e45"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53626f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5fae"/></marker></defs>
<rect width="800" height="446" fill="#ffffff"/>
<path d="M36 14 H392 L404 31 L392 48 H36 L24 31 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="35.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is the LiDAR reading inside the warning distance?</text>
<line x1="404" y1="31" x2="484" y2="31" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="24" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">no</text>
<rect x="488" y="14" width="294" height="34" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="635" y="35.5" font-size="12.5" fill="#53626f" text-anchor="middle">Say nothing</text>
<line x1="214" y1="48" x2="214" y2="74" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="66" font-size="12" fill="#53626f" font-weight="700">yes</text>
<path d="M36 78 H392 L404 95 L392 112 H36 L24 95 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="99.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is the thing ahead what the wearer is being guided to?</text>
<line x1="404" y1="95" x2="484" y2="95" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="88" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="488" y="78" width="294" height="34" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="635" y="99.5" font-size="12.5" fill="#53626f" text-anchor="middle">Say nothing</text>
<line x1="214" y1="112" x2="214" y2="138" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="130" font-size="12" fill="#53626f" font-weight="700">no</text>
<path d="M36 142 H392 L404 175 L392 208 H36 L24 175 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="179.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is it less than 1.5 s of walking away?</text>
<line x1="404" y1="175" x2="484" y2="175" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="168" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="488" y="142" width="294" height="66" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="635" y="163.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">“Stop, chair ahead, 1.1 meters.” It cuts</text><text x="635" y="179.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">in on whatever is being said, but is not</text><text x="635" y="195.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">repeated within 1.5 s</text>
<line x1="214" y1="208" x2="214" y2="234" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="226" font-size="12" fill="#53626f" font-weight="700">no</text>
<path d="M36 238 H392 L404 263 L392 288 H36 L24 263 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="259.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is the assistant still speaking, or was the last</text><text x="214" y="275.5" font-size="12.5" fill="#13202c" text-anchor="middle">warning too recent?</text>
<line x1="404" y1="263" x2="484" y2="263" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="256" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="488" y="246" width="294" height="34" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="635" y="267.5" font-size="12.5" fill="#53626f" text-anchor="middle">Say nothing</text>
<line x1="214" y1="288" x2="214" y2="314" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="306" font-size="12" fill="#53626f" font-weight="700">no</text>
<path d="M36 318 H392 L404 343 L392 368 H36 L24 343 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="339.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is it the same thing at the same distance, already</text><text x="214" y="355.5" font-size="12.5" fill="#13202c" text-anchor="middle">warned of in the last 15 s?</text>
<line x1="404" y1="343" x2="484" y2="343" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="336" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="488" y="326" width="294" height="34" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="635" y="347.5" font-size="12.5" fill="#53626f" text-anchor="middle">Say nothing</text>
<line x1="214" y1="368" x2="214" y2="394" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="386" font-size="12" fill="#53626f" font-weight="700">no</text>
<rect x="24" y="398" width="380" height="34" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="214" y="419.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">Otherwise: “Chair detected at 0.9 meters.”</text>
</svg>

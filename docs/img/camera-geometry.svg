<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="Left: a pixel at column 480 of 640 lies 16.8 degrees right of the camera&#x27;s axis. Right: a 2.0 m door that is 240 pixels tall in a 480-pixel picture is 4.4 m away.">

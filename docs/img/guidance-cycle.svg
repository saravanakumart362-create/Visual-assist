<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 654" width="800" height="654" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="One guidance cycle from the top: find the target again; stop if it is lost or within reach; otherwise sweep the LiDAR, gather the obstacles, plan the route and choose one action; give up aloud if stuck; otherwise say the action, wait, and begin again.">
<title>One guidance cycle from the top: find the target again; stop if it is lost or within reach; otherwise sweep the LiDAR, gather the obstacles, plan the route and choose one action; give up aloud if stuck; otherwise say the action, wait, and begin again.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#13202c"/></marker><marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0c7c74"/></marker><marker id="arrow-lidar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cf2e45"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53626f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5fae"/></marker></defs>
<rect width="800" height="654" fill="#ffffff"/>
<rect x="34" y="14" width="380" height="50" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="224" y="35.5" font-size="12.5" fill="#13202c" text-anchor="middle">Look where the target should be by now. If it is not</text><text x="224" y="51.5" font-size="12.5" fill="#13202c" text-anchor="middle">there, scan all 5 angles for it</text>
<line x1="224" y1="64" x2="224" y2="90" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<path d="M46 94 H402 L414 127 L402 160 H46 L34 127 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="224" y="131.5" font-size="12.5" fill="#13202c" text-anchor="middle">Was the target seen?</text>
<line x1="414" y1="127" x2="494" y2="127" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="456" y="120" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">no</text>
<rect x="498" y="94" width="284" height="66" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="640" y="115.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">Say it is being looked for, and look</text><text x="640" y="131.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">again. After 3 looks without it: “I lost</text><text x="640" y="147.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">sight of the door.” Guidance ends</text>
<line x1="224" y1="160" x2="224" y2="186" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="234" y="178" font-size="12" fill="#53626f" font-weight="700">yes</text>
<path d="M46 190 H402 L414 215 L402 240 H46 L34 215 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="224" y="219.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is it within reach?</text>
<line x1="414" y1="215" x2="494" y2="215" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="456" y="208" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="498" y="190" width="284" height="50" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="640" y="211.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">“You have reached the door.” Guidance</text><text x="640" y="227.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">ends</text>
<line x1="224" y1="240" x2="224" y2="266" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="234" y="258" font-size="12" fill="#53626f" font-weight="700">no</text>
<rect x="34" y="270" width="380" height="34" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="224" y="291.5" font-size="12.5" fill="#13202c" text-anchor="middle">Sweep the LiDAR across the room: 25 readings</text>
<line x1="224" y1="304" x2="224" y2="330" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<rect x="34" y="334" width="380" height="50" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="224" y="355.5" font-size="12.5" fill="#13202c" text-anchor="middle">Gather the obstacles: from the sweep, from what the camera</text><text x="224" y="371.5" font-size="12.5" fill="#13202c" text-anchor="middle">named, and from what is remembered</text>
<line x1="224" y1="384" x2="224" y2="410" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<rect x="34" y="414" width="380" height="50" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="224" y="435.5" font-size="12.5" fill="#13202c" text-anchor="middle">Search for the shortest safe route (A*), and choose the</text><text x="224" y="451.5" font-size="12.5" fill="#13202c" text-anchor="middle">next single action</text>
<line x1="224" y1="464" x2="224" y2="490" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<path d="M46 494 H402 L414 527 L402 560 H46 L34 527 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="224" y="515.5" font-size="12.5" fill="#13202c" text-anchor="middle">Stuck? Blocked 3 times running, turned through a full</text><text x="224" y="531.5" font-size="12.5" fill="#13202c" text-anchor="middle">circle without a walk, or ten actions with the target</text><text x="224" y="547.5" font-size="12.5" fill="#13202c" text-anchor="middle">no nearer</text>
<line x1="414" y1="527" x2="494" y2="527" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="456" y="520" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="498" y="502" width="284" height="50" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="640" y="523.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">“I cannot find a clear way to the door.”</text><text x="640" y="539.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">Guidance ends</text>
<line x1="224" y1="560" x2="224" y2="586" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="234" y="578" font-size="12" fill="#53626f" font-weight="700">no</text>
<rect x="34" y="590" width="380" height="50" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="224" y="611.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">Say the action, wait for the wearer to do it, and begin</text><text x="224" y="627.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">again</text>
<path d="M34 615 H10 V39 H30" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 268" width="750" height="268" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="Seen from above: the LiDAR beam aimed at the door stops at a chair 2.20 m away, while the door&#x27;s size in the picture puts it about 5 m away.">

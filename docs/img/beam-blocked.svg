<text x="329.7" y="63.5" font-size="13" fill="#13202c" text-anchor="middle" font-weight="700">chair</text>
<rect x="600" y="52.3" width="9" height="95.4" rx="0" fill="#f5b800" stroke="#13202c" stroke-width="1"/>

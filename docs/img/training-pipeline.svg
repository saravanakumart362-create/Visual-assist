<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 430" width="830" height="430" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="Two photo collections become the door dataset and, with a third, the banknote dataset. Training turns each into a model file. Those two and a ready-made model are loaded on the device, and converted to ONNX for the demo page.">
<title>Two photo collections become the door dataset and, with a third, the banknote dataset. Training turns each into a model file. Those two and a ready-made model are loaded on the device, and converted to ONNX for the demo page.</title>

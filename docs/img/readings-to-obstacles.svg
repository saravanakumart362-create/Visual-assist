<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 424" width="820" height="424" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="Seen from above: a sweep of 25 readings in a room with a wall and one opening. 14 readings met something and became 29 obstacle discs; the opening stays open.">

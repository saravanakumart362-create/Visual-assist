<rect x="12" y="14" width="440" height="396" rx="4" fill="none" stroke="#c5ced6" stroke-width="1"/>
<text x="306.4" y="92" font-size="12" fill="#13202c" text-anchor="middle" font-weight="700">door</text>
<circle cx="183.6" cy="279" r="10" fill="#13202c"/><text x="183.6" y="283.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<circle cx="486" cy="40" r="10" fill="#13202c"/><text x="486" y="44.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="504" y="44" font-size="12.5" fill="#13202c">Each reading that meets something becomes a</text><text x="504" y="60" font-size="12.5" fill="#13202c">disc. Its radius is half the gap to the next</text><text x="504" y="76" font-size="12.5" fill="#13202c">ray, so discs on one wall touch.</text>
<circle cx="69.6" cy="275.2" r="10" fill="#13202c"/><text x="69.6" y="279.7" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<circle cx="486" cy="110" r="10" fill="#13202c"/><text x="486" y="114.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="504" y="114" font-size="12.5" fill="#13202c">Where a wall is seen at a slant the hits are</text><text x="504" y="130" font-size="12.5" fill="#13202c">further apart. Hits on one surface are joined</text><text x="504" y="146" font-size="12.5" fill="#13202c">with extra discs (15 here, in lighter grey).</text>
<circle cx="306.4" cy="243" r="10" fill="#13202c"/><text x="306.4" y="247.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<circle cx="486" cy="180" r="10" fill="#13202c"/><text x="486" y="184.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="504" y="184" font-size="12.5" fill="#13202c">A jump this big between neighbouring rays is</text><text x="504" y="200" font-size="12.5" fill="#13202c">the edge of something, with open floor beside</text><text x="504" y="216" font-size="12.5" fill="#13202c">it. It is left open: this is the way through.</text>
<circle cx="352.9" cy="122.1" r="10" fill="#13202c"/><text x="352.9" y="126.6" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<circle cx="486" cy="250" r="10" fill="#13202c"/><text x="486" y="254.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="504" y="254" font-size="12.5" fill="#13202c">The readings beyond the opening are on the</text><text x="504" y="270" font-size="12.5" fill="#13202c">door itself.</text>
<circle cx="486" cy="310" r="3" fill="#cf2e45"/>
<text x="504" y="314" font-size="12" fill="#53626f">a LiDAR reading</text>
<circle cx="486" cy="330" r="6" fill="#44556a"/>
<text x="504" y="334" font-size="12" fill="#53626f">obstacle made from a reading</text>
<circle cx="486" cy="350" r="6" fill="#9fb0bf"/>
<text x="504" y="354" font-size="12" fill="#53626f">obstacle added to join two readings</text>
<circle cx="486" cy="370" r="6" fill="#dfe5ea"/>
<text x="504" y="374" font-size="12" fill="#53626f">the real wall</text>
</svg>

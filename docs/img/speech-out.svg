<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 318" width="800" height="318" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="How a sentence is spoken: it waits in a queue; the offline voice speaks it unless Google&#x27;s voice is wanted; if Google&#x27;s voice fails, the offline voice speaks it instead.">
<title>How a sentence is spoken: it waits in a queue; the offline voice speaks it unless Google&#x27;s voice is wanted; if Google&#x27;s voice fails, the offline voice speaks it instead.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#13202c"/></marker><marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0c7c74"/></marker><marker id="arrow-lidar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cf2e45"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53626f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5fae"/></marker></defs>
<rect width="800" height="318" fill="#ffffff"/>
<rect x="24" y="14" width="380" height="50" rx="5" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/><text x="214" y="35.5" font-size="12.5" fill="#13202c" text-anchor="middle">say(sentence) puts it on the queue. The speaker thread</text><text x="214" y="51.5" font-size="12.5" fill="#13202c" text-anchor="middle">takes the next one</text>
<line x1="214" y1="64" x2="214" y2="90" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<path d="M36 94 H392 L404 119 L392 144 H36 L24 119 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="115.5" font-size="12.5" fill="#13202c" text-anchor="middle">Is Google&#x27;s voice wanted? (backend gtts, or backend</text><text x="214" y="131.5" font-size="12.5" fill="#13202c" text-anchor="middle">auto with a language other than English)</text>
<line x1="404" y1="119" x2="484" y2="119" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="112" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">no</text>
<rect x="488" y="94" width="294" height="50" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="635" y="115.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">The offline voice speaks it: espeak-ng on</text><text x="635" y="131.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">the Pi, the Windows voice on a PC</text>
<line x1="214" y1="144" x2="214" y2="170" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="162" font-size="12" fill="#53626f" font-weight="700">yes</text>
<path d="M36 174 H392 L404 199 L392 224 H36 L24 199 Z" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/><text x="214" y="195.5" font-size="12.5" fill="#13202c" text-anchor="middle">Fetch the sentence from Google as an MP3, unless it is</text><text x="214" y="211.5" font-size="12.5" fill="#13202c" text-anchor="middle">already kept, and play it. Did that work?</text>
<line x1="404" y1="199" x2="484" y2="199" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="446" y="192" font-size="12" fill="#53626f" text-anchor="middle" font-weight="700">yes</text>
<rect x="488" y="182" width="294" height="34" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="635" y="203.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">Spoken</text>
<line x1="214" y1="224" x2="214" y2="250" fill="none" stroke="#13202c" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="224" y="242" font-size="12" fill="#53626f" font-weight="700">no</text>
<rect x="24" y="254" width="380" height="50" rx="5" fill="#fde9b0" stroke="#13202c" stroke-width="1.5"/><text x="214" y="275.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">Otherwise the offline voice speaks it, and Google&#x27;s voice</text><text x="214" y="291.5" font-size="12.5" fill="#13202c" text-anchor="middle" font-weight="700">is left alone for 60 s</text>
</svg>

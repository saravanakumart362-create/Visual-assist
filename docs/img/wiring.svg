<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="Wiring: the TF-Luna on four wires to the Raspberry Pi&#x27;s pins 2, 8, 10 and 6; the camera, microphone, earphone and ESP8266 on one cable each; the servo signals on the ESP8266&#x27;s D5 and D6, with power from a separate 5 V supply.">
<title>Wiring: the TF-Luna on four wires to the Raspberry Pi&#x27;s pins 2, 8, 10 and 6; the camera, microphone, earphone and ESP8266 on one cable each; the servo signals on the ESP8266&#x27;s D5 and D6, with power from a separate 5 V supply.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#13202c"/></marker><marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0c7c74"/></marker><marker id="arrow-lidar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cf2e45"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53626f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5fae"/></marker></defs>
<rect width="800" height="500" fill="#ffffff"/>
<rect x="310" y="30" width="180" height="410" rx="4" fill="#eef1f4" stroke="#13202c" stroke-width="1.5"/>
<text x="400" y="58" font-size="15" fill="#13202c" text-anchor="middle" font-weight="700">Raspberry Pi 4</text>
<circle cx="310" cy="100" r="4" fill="#13202c"/><text x="322" y="104" font-size="12" fill="#13202c">Pin 2: 5 V</text>
<circle cx="310" cy="135" r="4" fill="#13202c"/><text x="322" y="139" font-size="12" fill="#13202c">Pin 8: TXD (GPIO14)</text>
<circle cx="310" cy="170" r="4" fill="#13202c"/><text x="322" y="174" font-size="12" fill="#13202c">Pin 10: RXD (GPIO15)</text>
<circle cx="310" cy="205" r="4" fill="#13202c"/><text x="322" y="209" font-size="12" fill="#13202c">Pin 6: GND</text>
<circle cx="310" cy="290" r="4" fill="#13202c"/><text x="322" y="294" font-size="12" fill="#13202c">CSI connector</text>
<circle cx="310" cy="340" r="4" fill="#13202c"/><text x="322" y="344" font-size="12" fill="#13202c">USB port</text>
<circle cx="310" cy="390" r="4" fill="#13202c"/><text x="322" y="394" font-size="12" fill="#13202c">3.5 mm audio jack</text>
<circle cx="490" cy="100" r="4" fill="#13202c"/><text x="478" y="104" font-size="12" fill="#13202c" text-anchor="end">USB port</text>
<rect x="30" y="45" width="170" height="205" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>
<text x="115" y="72" font-size="14" fill="#13202c" text-anchor="middle" font-weight="700">TF-Luna LiDAR</text>
<line x1="200" y1="100" x2="310" y2="100" fill="none" stroke="#c62828" stroke-width="2.5"/>
<circle cx="200" cy="100" r="4" fill="#13202c"/><text x="188" y="104" font-size="12" fill="#13202c" text-anchor="end">1: +5 V</text>
<text x="255" y="93" font-size="11" fill="#53626f" text-anchor="middle">5 V</text>
<line x1="200" y1="135" x2="310" y2="135" fill="none" stroke="#1f5fae" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="200" cy="135" r="4" fill="#13202c"/><text x="188" y="139" font-size="12" fill="#13202c" text-anchor="end">2: RXD</text>
<text x="255" y="128" font-size="11" fill="#53626f" text-anchor="middle">not used</text>
<line x1="200" y1="170" x2="306" y2="170" fill="none" stroke="#1f5fae" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<circle cx="200" cy="170" r="4" fill="#13202c"/><text x="188" y="174" font-size="12" fill="#13202c" text-anchor="end">3: TXD</text>
<text x="255" y="163" font-size="11" fill="#53626f" text-anchor="middle">readings</text>
<line x1="200" y1="205" x2="310" y2="205" fill="none" stroke="#222222" stroke-width="2.5"/>
<circle cx="200" cy="205" r="4" fill="#13202c"/><text x="188" y="209" font-size="12" fill="#13202c" text-anchor="end">4: GND</text>

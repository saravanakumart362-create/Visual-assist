<text x="640" y="207" font-size="12" fill="#13202c" text-anchor="middle">D5</text>
<circle cx="690" cy="220" r="4" fill="#13202c"/>
<text x="690" y="207" font-size="12" fill="#13202c" text-anchor="middle">D6</text>
<circle cx="740" cy="220" r="4" fill="#13202c"/>
<text x="740" y="207" font-size="12" fill="#13202c" text-anchor="middle">GND</text>
<path d="M640 220 V262 H615 V300" fill="none" stroke="#e07b00" stroke-width="2.5"/>
<path d="M690 220 V275 H735 V300" fill="none" stroke="#e07b00" stroke-width="2.5"/>
<text x="607" y="291" font-size="11" fill="#53626f" text-anchor="end">signal</text>
<text x="743" y="291" font-size="11" fill="#53626f">signal</text>
<line x1="740" y1="220" x2="740" y2="234" fill="none" stroke="#222222" stroke-width="2"/><line x1="731" y1="234" x2="749" y2="234" fill="none" stroke="#222222" stroke-width="2"/><line x1="734" y1="238" x2="746" y2="238" fill="none" stroke="#222222" stroke-width="2"/><line x1="737" y1="242" x2="743" y2="242" fill="none" stroke="#222222" stroke-width="2"/>
<rect x="570" y="300" width="90" height="60" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>
<text x="615" y="335" font-size="13" fill="#13202c" text-anchor="middle" font-weight="600">Pan servo</text>
<circle cx="615" cy="300" r="4" fill="#13202c"/>
<circle cx="595" cy="360" r="4" fill="#13202c"/><circle cx="635" cy="360" r="4" fill="#13202c"/>
<line x1="635" y1="360" x2="635" y2="372" fill="none" stroke="#222222" stroke-width="2"/><line x1="626" y1="372" x2="644" y2="372" fill="none" stroke="#222222" stroke-width="2"/><line x1="629" y1="376" x2="641" y2="376" fill="none" stroke="#222222" stroke-width="2"/><line x1="632" y1="380" x2="638" y2="380" fill="none" stroke="#222222" stroke-width="2"/>
<rect x="690" y="300" width="90" height="60" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>
<text x="735" y="335" font-size="13" fill="#13202c" text-anchor="middle" font-weight="600">Tilt servo</text>
<circle cx="735" cy="300" r="4" fill="#13202c"/>
<circle cx="715" cy="360" r="4" fill="#13202c"/><circle cx="755" cy="360" r="4" fill="#13202c"/>
<line x1="755" y1="360" x2="755" y2="372" fill="none" stroke="#222222" stroke-width="2"/><line x1="746" y1="372" x2="764" y2="372" fill="none" stroke="#222222" stroke-width="2"/><line x1="749" y1="376" x2="761" y2="376" fill="none" stroke="#222222" stroke-width="2"/><line x1="752" y1="380" x2="758" y2="380" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M595 360 V394 H715 V360 M655 394 V414" fill="none" stroke="#c62828" stroke-width="2.5"/>
<text x="675" y="388" font-size="11" fill="#53626f" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">+5 V</text>
<rect x="590" y="414" width="130" height="34" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>
<text x="655" y="436" font-size="13" fill="#13202c" text-anchor="middle" font-weight="600">5 V supply</text>
<circle cx="655" cy="414" r="4" fill="#13202c"/>
<path d="M720 431 H742 V438" fill="none" stroke="#222222" stroke-width="2"/><line x1="733" y1="438" x2="751" y2="438" fill="none" stroke="#222222" stroke-width="2"/><line x1="736" y1="442" x2="748" y2="442" fill="none" stroke="#222222" stroke-width="2"/><line x1="739" y1="446" x2="745" y2="446" fill="none" stroke="#222222" stroke-width="2"/>
<text x="468" y="474" font-size="11.5" fill="#53626f">Servo power comes from its own 5 V supply, not from the</text><text x="468" y="489" font-size="11.5" fill="#53626f">ESP8266&#x27;s 3.3 V pin. All the ground points are joined.</text>

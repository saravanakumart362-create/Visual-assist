<text x="255" y="282" font-size="11" fill="#53626f" text-anchor="middle">ribbon cable</text>
<line x1="200" y1="340" x2="310" y2="340" fill="none" stroke="#8a97a3" stroke-width="4"/>
<rect x="30" y="322" width="170" height="36" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>
<text x="115" y="345" font-size="13" fill="#13202c" text-anchor="middle" font-weight="600">USB microphone</text>
<text x="255" y="332" font-size="11" fill="#53626f" text-anchor="middle">USB</text>
<line x1="200" y1="390" x2="310" y2="390" fill="none" stroke="#8a97a3" stroke-width="4"/>
<rect x="30" y="372" width="170" height="36" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>
<text x="115" y="395" font-size="13" fill="#13202c" text-anchor="middle" font-weight="600">Earphone</text>
<text x="255" y="382" font-size="11" fill="#53626f" text-anchor="middle">audio cable</text>
<line x1="490" y1="100" x2="600" y2="100" fill="none" stroke="#8a97a3" stroke-width="4"/>
<text x="545" y="91" font-size="11" fill="#53626f" text-anchor="middle">USB cable</text>
<text x="545" y="118" font-size="11" fill="#53626f" text-anchor="middle">power and serial</text>
<rect x="600" y="45" width="170" height="175" rx="4" fill="#ffffff" stroke="#13202c" stroke-width="1.5"/>

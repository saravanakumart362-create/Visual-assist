<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" aria-label="Seen from above: the path walked from the start, round the chair by the left, to the door, with 5 numbered places where the assistant spoke.">
<title>Seen from above: the path walked from the start, round the chair by the left, to the door, with 5 numbered places where the assistant spoke.</title>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#13202c"/></marker><marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0c7c74"/></marker><marker id="arrow-lidar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cf2e45"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53626f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5fae"/></marker></defs>
<rect width="820" height="520" fill="#ffffff"/>
<line x1="46.4" y1="492" x2="365.6" y2="492" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="496" font-size="11" fill="#53626f" text-anchor="end">0 m</text>
<line x1="46.4" y1="416" x2="365.6" y2="416" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="420" font-size="11" fill="#53626f" text-anchor="end">1 m</text>
<line x1="46.4" y1="340" x2="365.6" y2="340" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="344" font-size="11" fill="#53626f" text-anchor="end">2 m</text>
<line x1="46.4" y1="264" x2="365.6" y2="264" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="268" font-size="11" fill="#53626f" text-anchor="end">3 m</text>
<line x1="46.4" y1="188" x2="365.6" y2="188" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="192" font-size="11" fill="#53626f" text-anchor="end">4 m</text>
<line x1="46.4" y1="112" x2="365.6" y2="112" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="116" font-size="11" fill="#53626f" text-anchor="end">5 m</text>
<line x1="46.4" y1="36" x2="365.6" y2="36" fill="none" stroke="#c5ced6" stroke-width="0.5"/>
<text x="40.4" y="40" font-size="11" fill="#53626f" text-anchor="end">6 m</text>
<circle cx="206" cy="77.8" r="34.2" fill="#f5b800" stroke="#13202c" stroke-width="1"/>
<text x="249.3" y="81.8" font-size="12.5" fill="#13202c" font-weight="700">door</text>
<circle cx="206" cy="305.8" r="19" fill="#44556a"/>
<text x="234.1" y="309.8" font-size="12.5" fill="#13202c" font-weight="700">chair</text>
<polyline points="206,492 114.8,334.1 114.8,197.3 137.6,157.8 160.4,118.2" fill="none" stroke="#0c7c74" stroke-width="3.5"/>
<circle cx="206" cy="492" r="10" fill="#0c7c74"/><text x="206" y="496.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<circle cx="114.8" cy="334.1" r="10" fill="#0c7c74"/><text x="114.8" y="338.6" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<circle cx="114.8" cy="197.3" r="10" fill="#0c7c74"/><text x="114.8" y="201.8" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<circle cx="137.6" cy="157.8" r="10" fill="#0c7c74"/><text x="137.6" y="162.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<circle cx="160.4" cy="118.2" r="10" fill="#0c7c74"/><text x="160.4" y="122.7" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="420" y="34" font-size="15" fill="#13202c" font-weight="700">What was said, and where</text>
<circle cx="430" cy="60" r="10" fill="#0c7c74"/><text x="430" y="64.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="450" y="64" font-size="12.5" fill="#13202c">“Scanning.”</text>
<text x="450" y="82" font-size="12.5" fill="#13202c">“The door is straight ahead, about 5 meters away.”</text>
<text x="450" y="100" font-size="12.5" fill="#13202c">“Chair in the way. Turn slightly left.”</text>
<text x="450" y="118" font-size="12.5" fill="#13202c">“Move forward 4 steps.”</text>
<circle cx="430" cy="144" r="10" fill="#0c7c74"/><text x="430" y="148.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="450" y="148" font-size="12.5" fill="#13202c">“Turn slightly right.”</text>
<text x="450" y="166" font-size="12.5" fill="#13202c">“Move forward 3 steps.”</text>
<circle cx="430" cy="192" r="10" fill="#0c7c74"/><text x="430" y="196.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="450" y="196" font-size="12.5" fill="#13202c">“Turn slightly right.”</text>
<text x="450" y="214" font-size="12.5" fill="#13202c">“Move forward 1 step.”</text>
<circle cx="430" cy="240" r="10" fill="#0c7c74"/><text x="430" y="244.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="450" y="244" font-size="12.5" fill="#13202c">“Move forward 1 step.”</text>
<circle cx="430" cy="270" r="10" fill="#0c7c74"/><text x="430" y="274.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="450" y="274" font-size="12.5" fill="#13202c">“You have reached the door. It is slightly to your right.”</text>
<text x="420" y="312" font-size="12" fill="#53626f">The wearer walked 5.4 m and never came nearer than</text><text x="420" y="328" font-size="12" fill="#53626f">0.95 m to the chair. After every instruction the device</text><text x="420" y="344" font-size="12" fill="#53626f">looked, swept and planned again from where the wearer then stood.</text>
</svg>
